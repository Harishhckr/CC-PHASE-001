{% extends 'base.html' %}
{% block content %}
<section class="max-w-lg mx-auto bg-white dark:bg-slate-800 p-8 rounded-lg shadow">
    <h1 class="text-2xl font-semibold mb-2">Login</h1>
    <p class="text-slate-500 mb-6">Use demo credentials: demo / password</p>
    <form class="space-y-4">
        <input class="w-full px-3 py-2 rounded border" placeholder="Username" />
        <input type="password" class="w-full px-3 py-2 rounded border" placeholder="Password" />
        <button class="w-full px-4 py-2 rounded bg-emerald-600 text-white">Sign In</button>
    </form>
    <div class="mt-4">
        <button class="text-sm text-emerald-600" onclick="toggleTheme()">Toggle Dark Mode</button>
    </div>
</section>
{% endblock %}
